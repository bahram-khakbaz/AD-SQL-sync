services:
  postgres-db:
    image: mirror2.chabokan.net/postgres:15-alpine
    container_name: internal_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sync_storage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  sync-script:
    build: .
    container_name: rahkaran_ad_sync
    ports:
      - "80:8080"
    environment:
      - TZ=Asia/Tehran
      - WEEKLY_REBUILD_WEEKDAY=4
      - PG_CONN_STR=${PG_CONN_STR}
      - SQL_CONN_STR=${SQL_CONN_STR}
      - LDAP_SERVER=${LDAP_SERVER}
      - LDAP_USER=${LDAP_USER}
      - LDAP_PASSWORD=${LDAP_PASSWORD}
      - AD_SEARCH_BASE=${AD_SEARCH_BASE}
      - AD_COMPANY_VALUE=${AD_COMPANY_VALUE:-Digi Express}
    volumes:
      - .:/opt/digiexpress-sync
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: always

volumes:
  pgdata:
